name: CI
on: push
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  check_version:
    # checks if the workflow is triggered by a properly formatted tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Check Version Tag
    steps:
      - name: Check Version Tag Format
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format 'vX.Y.Z' where X, Y, Z are integers."
            exit 1
          fi

  build_gh_pages:
    runs-on: ubuntu-latest
    name: Build & Deploy to Github Pages
    needs: check_version
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🏠 Checkout repository
        uses: actions/checkout@v4

      - name: 📄 Switch config for GitHub Pages
        run: mv vite.config.ts.gh-pages vite.config.ts

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Build
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: check_version
    name: Build & Push Docker Image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: 🏠 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: 🏗️ Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish_release:
    # Only run this job if the workflow is triggered by a tag
    needs: check_version
    runs-on: ubuntu-latest
    name: Publish GitHub Release
    permissions:
      packages: write
      contents: write
    steps:
      - name: 🏠 Checkout repository
        uses: actions/checkout@v4

      - name: Create a Release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: Release ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
